name: "Kafka Connect CI"
on:
  push:
    branches:
    - 'main'
    - 'CDCTF-*'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:

  kafka-connect-tests:
    runs-on: self-hosted
    strategy:
      max-parallel: 15
      matrix:
        jvm: [17, 21]
    steps:
    - id: proxy
      uses: kakao-actions/setup-common-proxy@v1
    - uses: actions/checkout@v4
    - uses: actions/setup-java@v4
      with:
        distribution: zulu
        java-version: ${{ matrix.jvm }}
    - uses: actions/cache@v3
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
        key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
        restore-keys: ${{ runner.os }}-gradle-
    - run: echo -e "$(ip addr show eth0 | grep "inet\b" | awk '{print $2}' | cut -d/ -f1)\t$(hostname -f) $(hostname -s)" | sudo tee -a /etc/hosts
    - run: |
        ./gradlew -DsparkVersions= -DflinkVersions= -DkafkaVersions=3 \
          -g "${{ steps.proxy.outputs.gradle-home }}" \
          :iceberg-kafka-connect:iceberg-kafka-connect-events:check \
          :iceberg-kafka-connect:iceberg-kafka-connect-transforms:check \
          :iceberg-kafka-connect:iceberg-kafka-connect:check \
          :iceberg-kafka-connect:iceberg-kafka-connect-runtime:check \
          -Pquick=true -x javadoc
    - uses: actions/upload-artifact@v3
      if: failure()
      with:
        name: test logs
        path: |
          **/build/testlogs
          kafka-connect/kafka-connect-runtime/build/reports/tests
